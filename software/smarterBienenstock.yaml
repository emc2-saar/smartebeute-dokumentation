                     sprintf(buf, "%.1f", id(tempinnen).state);
                     return buf;       
                   field4: !lambda |-
                     char buf[10];
                     sprintf(buf, "%.1f", id(feuchteinnen).state);
                     return buf;     	
                   field5: !lambda |-
                     char buf[10];
                     sprintf(buf, "%.1f", id(tempbrut).state);
                     return buf;     	
                   field6: !lambda |-
                     char buf[10];
                     sprintf(buf, "%.1f", id(temphonig).state);
                     return buf;
                 on_response:
                   then:
                     - light.turn_on:
                         effect: "None"
