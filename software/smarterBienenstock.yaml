                         brightness: 50%
                         red: 0%
                         green: 100%
                         blue: 0%
                 on_error:
                   then:
                     - light.turn_on:
                         effect: "None"
                         id: led
                         brightness: 50%
                         red: 100%
                         green: 100%
                         blue: 0%

